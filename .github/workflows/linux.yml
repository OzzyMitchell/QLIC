name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpng-dev libwebp-dev libjxl-dev libavif-dev libtiff-dev libwim-dev

      - name: Release
        run: |
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-release
          ctest --test-dir build/ci-release --output-on-failure

      - name: Installed CMake and pkg-config SDKs
        run: |
          cmake --install build/ci-release --prefix "$PWD/build/ci-install"
          cmake -S tests/package_consumer -B build/ci-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/ci-install"
          cmake --build build/ci-consumer
          build/ci-consumer/qlic-package-consumer-static
          LD_LIBRARY_PATH="$PWD/build/ci-install/lib" build/ci-consumer/qlic-package-consumer-shared
          export PKG_CONFIG_PATH="$PWD/build/ci-install/lib/pkgconfig"
          test "$(pkg-config --modversion qlic)" = "1.0.1"
          cc tests/package_consumer/main.c -o build/qlic-pkg-config-consumer $(pkg-config --cflags --libs qlic)
          LD_LIBRARY_PATH="$PWD/build/ci-install/lib" build/qlic-pkg-config-consumer

      - name: Minimal dependencies
        run: |
          cmake -S . -B build/ci-minimal -G Ninja -DCMAKE_BUILD_TYPE=Release -DQLIC_BUILD_CLI=OFF -DQLIC_LINUX_LZMS=OFF
          cmake --build build/ci-minimal
          ctest --test-dir build/ci-minimal --output-on-failure

      - name: Clang sanitizers
        env:
          CC: clang
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build/ci-sanitize -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQLIC_SANITIZE=ON
          cmake --build build/ci-sanitize
          ctest --test-dir build/ci-sanitize --output-on-failure

      - name: Coverage-guided decoder fuzzing
        env:
          CC: clang
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build/ci-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQLIC_BUILD_CLI=OFF -DQLIC_LINUX_LZMS=OFF -DQLIC_LIBFUZZER=ON
          cmake --build build/ci-fuzz --target qlic-fuzz-decode
          build/ci-fuzz/qlic-fuzz-decode tests/fixtures -runs=20000 -max_len=1048576 -timeout=20

      - name: Rust decoder
        working-directory: rust/qlic-decoder
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --all-targets
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release --all-targets
